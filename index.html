<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arche Nova // Command Center</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #030305;
            color: #00ffcc;
            font-family: 'Courier New', Courier, monospace;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
        }

        /* Dynamischer Sternenhimmel im Hintergrund */
        #starfield {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            pointer-events: none;
        }

        /* Hauptcontainer im vertikalen Layout */
        .container {
            width: 100%;
            max-width: 600px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            z-index: 1;
        }

        /* Pulsierende, interaktive Cyberpunk Glas-Panels */
        .panel {
            background: rgba(10, 15, 25, 0.85);
            border: 2px solid #00ffcc;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.2), inset 0 0 15px rgba(0, 255, 204, 0.05);
            backdrop-filter: blur(10px);
            animation: neonGlow 4s infinite alternate;
        }

        @keyframes neonGlow {
            0% {
                border-color: rgba(0, 255, 204, 0.6);
                box-shadow: 0 0 15px rgba(0, 255, 204, 0.3), inset 0 0 10px rgba(0, 255, 204, 0.1);
            }
            100% {
                border-color: rgba(255, 0, 204, 0.6);
                box-shadow: 0 0 20px rgba(255, 0, 204, 0.3), inset 0 0 10px rgba(255, 0, 204, 0.1);
            }
        }

        h1, h2 {
            font-size: 1.2rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 12px;
            color: #00ffcc;
            text-shadow: 0 0 8px rgba(0, 255, 204, 0.6);
        }

        /* Terminal & Konsole */
        .terminal-output {
            background: rgba(0, 0, 0, 0.7);
            border: 1px solid rgba(0, 255, 204, 0.4);
            border-radius: 6px;
            padding: 10px;
            height: 120px;
            overflow-y: auto;
            font-size: 0.85rem;
            margin-bottom: 10px;
            color: #aaffff;
        }

        .terminal-input-row {
            display: flex;
            gap: 10px;
        }

        input[type="text"], textarea {
            width: 100%;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(0, 255, 204, 0.5);
            border-radius: 6px;
            color: #00ffcc;
            padding: 10px;
            font-family: inherit;
            font-size: 0.9rem;
            outline: none;
        }

        input[type="text"]:focus, textarea:focus {
            border-color: #ff00cc;
            box-shadow: 0 0 10px rgba(255, 0, 204, 0.5);
        }

        button {
            background: rgba(0, 255, 204, 0.15);
            border: 1px solid #00ffcc;
            color: #00ffcc;
            padding: 10px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-family: inherit;
            font-weight: bold;
            text-transform: uppercase;
            transition: all 0.2s ease;
        }

        button:hover {
            background: #00ffcc;
            color: #030305;
            box-shadow: 0 0 15px #00ffcc;
        }

        .btn-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-top: 10px;
        }

        /* Redaktions-Pult & Scrollbarer Tresor */
        #chronik-feed {
            max-height: 400px;
            overflow-y: auto;
            padding-right: 6px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 15px;
        }

        #chronik-feed::-webkit-scrollbar, .terminal-output::-webkit-scrollbar {
            width: 6px;
        }
        #chronik-feed::-webkit-scrollbar-track, .terminal-output::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.4);
            border-radius: 3px;
        }
        #chronik-feed::-webkit-scrollbar-thumb, .terminal-output::-webkit-scrollbar-thumb {
            background: #ff00cc;
            border-radius: 3px;
            box-shadow: 0 0 6px #ff00cc;
        }

        .tresor-karte {
            background: rgba(5, 10, 15, 0.6);
            border: 1px solid rgba(0, 255, 204, 0.3);
            border-left: 4px solid #00ffcc;
            border-radius: 6px;
            padding: 12px;
            position: relative;
        }

        .tresor-karte img {
            max-width: 100%;
            max-height: 250px;
            border-radius: 4px;
            margin-top: 8px;
            display: block;
            object-fit: contain;
        }

        .delete-btn {
            position: absolute;
            top: 8px;
            right: 8px;
            background: transparent;
            border: none;
            color: #ff4444;
            cursor: pointer;
            font-size: 0.9rem;
            padding: 2px 6px;
        }
        .delete-btn:hover {
            color: #ff0000;
            background: rgba(255,0,0,0.1);
        }

        .backup-row {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid rgba(0, 255, 204, 0.2);
            flex-wrap: wrap;
        }

        .backup-row button {
            font-size: 0.75rem;
            padding: 6px 10px;
            flex: 1;
        }

        /* Cyber-Balloon Modal (Minispiel) */
        #game-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(3, 3, 5, 0.95);
            z-index: 100;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            gap: 10px;
        }

        #game-canvas {
            border: 2px solid #00ffcc;
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.5);
            background: #000;
            max-width: 100%;
        }

        .score-board {
            display: flex;
            justify-content: space-between;
            width: 360px;
            max-width: 100%;
            font-size: 1rem;
            color: #ff00cc;
            text-shadow: 0 0 8px #ff00cc;
            padding: 0 5px;
        }

        .game-controls {
            display: flex;
            gap: 20px;
            width: 360px;
            max-width: 100%;
        }

        .game-controls button {
            flex: 1;
            padding: 15px;
            font-size: 1.1rem;
            background: rgba(0, 255, 204, 0.2);
        }

        .close-game {
            background: #ff4444;
            border-color: #ff4444;
            color: #fff;
            width: 360px;
            max-width: 100%;
        }

        .cyber-eye {
            text-align: center;
            cursor: pointer;
            font-size: 1.5rem;
            padding: 5px;
            user-select: none;
        }
    </style>
</head>
<body>

    <canvas id="starfield"></canvas>

    <div class="container">
        
        <!-- Header / Status -->
        <div class="panel">
            <h1>Arche Nova // Orbit</h1>
            <p style="font-size: 0.85rem; opacity: 0.7;">System-Souveränität: Aktiv | Lokaler Tresor: Gesichert</p>
            <div class="cyber-eye" onclick="startCyberBalloonGame()" title="Cyber-Balloon starten">👁️</div>
        </div>

        <!-- Command Console / Terminal -->
        <div class="panel">
            <h2>Command Console</h2>
            <div id="terminal-out" class="terminal-output">System initialisiert... Bereit für Eingaben.<br> Tippe 'help' für Befehle.</div>
            <div class="terminal-input-row">
                <input type="text" id="terminal-cmd" placeholder="Befehl eingeben (z.B. help, status, play)..." onkeypress="checkEnter(event)">
                <button onclick="executeCommand()">Exec</button>
            </div>
            <div class="btn-grid">
                <button onclick="runQuickCmd('help')">> HELP</button>
                <button onclick="runQuickCmd('status')">> STATUS</button>
                <button onclick="runQuickCmd('clear')">> CLEAR</button>
                <button onclick="startCyberBalloonGame()">> PLAY GAME</button>
            </div>
        </div>

        <!-- Redaktions-Pult & Scrollbarer Tresor -->
        <div class="panel">
            <h2>Redaktions-Pult // Tresor</h2>
            <textarea id="tresor-text" placeholder="Gedanken, Notizen oder Logbuch-Eintrag hier erfassen..." rows="3"></textarea>
            <div style="margin-top: 10px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap;">
                <input type="file" id="tresor-file" accept="image/*" style="font-size: 0.8rem; color: #aaffff; flex: 1;">
                <button onclick="neuerEintragSpeichern()">Eintrag sichern</button>
            </div>

            <!-- Backup & Restore Werkzeuge -->
            <div class="backup-row">
                <button onclick="exportTresor()" title="Alle Einträge als Datei sichern">💾 Tresor sichern</button>
                <button onclick="document.getElementById('import-file').click()" title="Gesicherte Datei laden">📂 Tresor laden</button>
                <input type="file" id="import-file" accept=".json" style="display: none;" onchange="importTresor(event)">
            </div>

            <!-- Scrollbarer Feed -->
            <div id="chronik-feed">
                <!-- Dynamische Einträge landen hier -->
            </div>
        </div>

    </div>

    <!-- Cyber-Balloon Modal -->
    <div id="game-modal">
        <div class="score-board">
            <span>SCORE: <b id="current-score">0</b></span>
            <span>HIGH: <b id="high-score">0</b></span>
        </div>
        <canvas id="game-canvas" width="360" height="380"></canvas>
        <div class="game-controls">
            <button onclick="movePlayer(-25)">◀ LINKS</button>
            <button onclick="movePlayer(25)">RECHTS ▶</button>
        </div>
        <button class="close-game" onclick="stopCyberBalloonGame()">Spiel beenden</button>
    </div>

    <script>
        /* --- 1. STERNENHIMMEL ANIMATION --- */
        const canvas = document.getElementById('starfield');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        const stars = Array.from({ length: 80 }, () => ({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            size: Math.random() * 1.8,
            speed: Math.random() * 0.4 + 0.1
        }));

        function animateStars() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#00ffcc';
            stars.forEach(star => {
                star.y -= star.speed;
                if (star.y < 0) star.y = canvas.height;
                ctx.fillRect(star.x, star.y, star.size, star.size);
            });
            requestAnimationFrame(animateStars);
        }
        animateStars();

        /* --- 2. TERMINAL LOGIK --- */
        function logToTerminal(text) {
            const out = document.getElementById('terminal-out');
            out.innerHTML += `<br>> ${text}`;
            out.scrollTop = out.scrollHeight;
        }

        function checkEnter(e) {
            if (e.key === 'Enter') executeCommand();
        }

        function runQuickCmd(cmd) {
            document.getElementById('terminal-cmd').value = cmd;
            executeCommand();
        }

        function executeCommand() {
            const input = document.getElementById('terminal-cmd');
            const val = input.value.trim().toLowerCase();
            if (!val) return;

            logToTerminal(val);

            if (val === 'help') {
                logToTerminal('Verfügbare Befehle: help, status, clear, play');
            } else if (val === 'status') {
                logToTerminal('Arche Nova Core: Online. Lokaler Speicher aktiv.');
            } else if (val === 'clear') {
                document.getElementById('terminal-out').innerHTML = 'Terminal bereinigt.';
            } else if (val === 'play') {
                startCyberBalloonGame();
            } else {
                logToTerminal(`Unbekannter Befehl: '${val}'. Tippe 'help'.`);
            }
            input.value = '';
        }

        /* --- 3. SCROLLBARER TRESOR & BACKUP LOGIK --- */
        function renderChronik() {
            const feed = document.getElementById('chronik-feed');
            if (!feed) return;

            const eintrgae = JSON.parse(localStorage.getItem('arche_nova_chronik')) || [];
            feed.innerHTML = '';

            if (eintrgae.length === 0) {
                feed.innerHTML = '<p style="opacity: 0.4; text-align: center; font-size: 0.85rem; padding: 10px;">Der Tresor ist noch leer...</p>';
                return;
            }

            eintrgae.slice().reverse().forEach((eintrag, index) => {
                const originalIndex = eintrgae.length - 1 - index;
                const item = document.createElement('div');
                item.className = 'tresor-karte';

                let textHTML = '';
                if (eintrag.text) {
                    textHTML = `<div style="word-break: break-word; font-size: 0.9rem;">${eintrag.text.replace(/\n/g, '<br>')}</div>`;
                }

                let medienHTML = '';
                if (eintrag.media) {
                    medienHTML = `<img src="${eintrag.media}" alt="Gespeichertes Medium">`;
                }

                item.innerHTML = `
                    <div style="font-size: 0.7rem; opacity: 0.5; margin-bottom: 6px;">${eintrag.zeitstempel}</div>
                    ${textHTML}
                    ${medienHTML}
                    <button class="delete-btn" onclick="loescheEintrag(${originalIndex})" title="Eintrag löschen">✕</button>
                `;
                feed.appendChild(item);
            });
        }

        function neuerEintragSpeichern() {
            const textArea = document.getElementById('tresor-text');
            const fileInput = document.getElementById('tresor-file');
            const textVal = textArea.value.trim();

            if (!textVal && fileInput.files.length === 0) return;

            if (fileInput.files.length > 0) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    speichereInStorage(textVal, e.target.result);
                };
                reader.readAsDataURL(fileInput.files[0]);
            } else {
                speichereInStorage(textVal, null);
            }
        }

        function speichereInStorage(text, mediaBase64) {
            const eintrgae = JSON.parse(localStorage.getItem('arche_nova_chronik')) || [];
            const neuerEintrag = {
                text: text,
                media: mediaBase64,
                zeitstempel: new Date().toLocaleString('de-DE')
            };

            eintrgae.push(neuerEintrag);
            localStorage.setItem('arche_nova_chronik', JSON.stringify(eintrgae));

            document.getElementById('tresor-text').value = '';
            document.getElementById('tresor-file').value = '';
            renderChronik();
        }

        function loescheEintrag(index) {
            let eintrgae = JSON.parse(localStorage.getItem('arche_nova_chronik')) || [];
            eintrgae.splice(index, 1);
            localStorage.setItem('arche_nova_chronik', JSON.stringify(eintrgae));
            renderChronik();
        }

        function exportTresor() {
            const data = localStorage.getItem('arche_nova_chronik');
            if (!data || JSON.parse(data).length === 0) {
                alert('Der Tresor ist leer, es gibt nichts zu sichern.');
                return;
            }
            const blob = new Blob([data], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `arche_nova_tresor_backup_${new Date().toISOString().slice(0,10)}.json`;
            a.click();
            URL.revokeObjectURL(url);
        }

        function importTresor(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const parsed = JSON.parse(e.target.result);
                    if (Array.isArray(parsed)) {
                        localStorage.setItem('arche_nova_chronik', JSON.stringify(parsed));
                        renderChronik();
                        alert('Tresor erfolgreich wiederhergestellt!');
                    } else {
                        alert('Ungültiges Backup-Format.');
                    }
                } catch (err) {
                    alert('Fehler beim Einlesen der Datei.');
                }
            };
            reader.readAsText(file);
        }

        document.addEventListener('DOMContentLoaded', renderChronik);

        /* --- 4. ADVANCED CYBER-BALLOON MINISPIEL (Punkte & Münzen) --- */
        let gameInterval = null;
        const modal = document.getElementById('game-modal');
        const gCanvas = document.getElementById('game-canvas');
        const gCtx = gCanvas.getContext('2d');
        
        let balloon = { x: 180, y: 320, radius: 16 };
        let items = []; // Rote Hindernisse & Gelbe Münzen
        let score = 0;
        let highScore = localStorage.getItem('arche_nova_highscore') || 0;

        function startCyberBalloonGame() {
            modal.style.display = 'flex';
            balloon.x = gCanvas.width / 2;
            balloon.y = gCanvas.height - 40;
            items = [];
            score = 0;
            
            document.getElementById('current-score').innerText = score;
            document.getElementById('high-score').innerText = highScore;

            if (gameInterval) clearInterval(gameInterval);
            gameInterval = setInterval(updateGame, 1000 / 60);
        }

        function stopCyberBalloonGame() {
            modal.style.display = 'none';
            clearInterval(gameInterval);
        }

        function movePlayer(offset) {
            balloon.x = Math.max(20, Math.min(gCanvas.width - 20, balloon.x + offset));
        }

        gCanvas.addEventListener('click', (e) => {
            const rect = gCanvas.getBoundingClientRect();
            const clickX = e.clientX - rect.left;
            if (clickX < gCanvas.width / 2) movePlayer(-30);
            else movePlayer(30);
        });

        function updateGame() {
            gCtx.clearRect(0, 0, gCanvas.width, gCanvas.height);

            // Neue Objekte erzeugen
            if (Math.random() < 0.04) {
                const isCoin = Math.random() < 0.4; // 40% Chance auf gelbe Münze
                items.push({
                    x: Math.random() * (gCanvas.width - 40) + 20,
                    y: 0,
                    radius: isCoin ? 10 : 13,
                    speed: Math.random() * 2 + 1.8,
                    type: isCoin ? 'coin' : 'obstacle'
                });
            }

            // Objekte bewegen & kollidieren
            items.forEach((item, index) => {
                item.y += item.speed;

                // Zeichnen
                gCtx.beginPath();
                gCtx.arc(item.x, item.y, item.radius, 0, Math.PI * 2);
                if (item.type === 'coin') {
                    gCtx.fillStyle = '#ffcc00'; // Gelbe Energie-Münze
                    gCtx.shadowBlur = 10;
                    gCtx.shadowColor = '#ffcc00';
                } else {
                    gCtx.fillStyle = '#ff4444'; // Roter Asteroid
                    gCtx.shadowBlur = 8;
                    gCtx.shadowColor = '#ff4444';
                }
                gCtx.fill();
                gCtx.shadowBlur = 0; // Reset

                // Kollision prüfen
                let dist = Math.hypot(balloon.x - item.x, balloon.y - item.y);
                if (dist < balloon.radius + item.radius) {
                    if (item.type === 'coin') {
                        // Münze eingesammelt!
                        score += 100;
                        document.getElementById('current-score').innerText = score;
                        if (score > highScore) {
                            highScore = score;
                            localStorage.setItem('arche_nova_highscore', highScore);
                            document.getElementById('high-score').innerText = highScore;
                        }
                        items.splice(index, 1);
                    } else {
                        // Roter Asteroid getroffen - CRASH!
                        stopCyberBalloonGame();
                        alert(`GAME OVER! Finaler Score: ${score} Punkte.`);
                    }
                }

                if (item.y > gCanvas.height) items.splice(index, 1);
            });

            // Spieler (Cyber-Balloon)
            gCtx.beginPath();
            gCtx.arc(balloon.x, balloon.y, balloon.radius, 0, Math.PI * 2);
            gCtx.fillStyle = '#00ffcc';
            gCtx.shadowBlur = 12;
            gCtx.shadowColor = '#00ffcc';
            gCtx.fill();
            gCtx.shadowBlur = 0;
        }
    </script>
</body>
</html>
